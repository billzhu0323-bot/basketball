services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: localpulse
      POSTGRES_PASSWORD: localpulse_dev
      POSTGRES_DB: localpulse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localpulse -d localpulse"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
